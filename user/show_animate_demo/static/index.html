<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wan Animate 2.2 换人展示</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-glow"></div>
  <header class="hero">
    <div class="hero__content">
      <span class="eyebrow">WAN ANIMATE 2.2 · SHOWCASE</span>
      <h1>换人工作流 · 可视化展示台</h1>
      <p>三步完成：15角度角色图 → SAM3 分割 → 模型推理。目标是让用户一眼看懂、直接上手。</p>
      <div class="hero__meta">
        <span>视频短边 > 640 会自动缩放</span>
        <span>fps 自动对齐到同一设置</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <div class="tabs">
        <button class="tab-btn active" data-tab="main">快速生成</button>
        <button class="tab-btn" data-tab="details">图片 / 遮罩</button>
      </div>

      <div class="tab-panel active" id="tab-main">
      <div class="panel__header">
        <div>
          <h2>一键生成</h2>
          <p>上传/选择视频 + 选择角色图文件夹，即可按默认参数生成结果。</p>
        </div>
      </div>
      <div class="form-grid">
        <label>
          上传视频
          <input id="sam3-video" type="file" accept="video/*" />
        </label>
        <label>
          选择已有视频
          <select id="sam3-video-list"></select>
        </label>
        <label>
          角色图文件夹
          <select id="infer-character"></select>
        </label>
        <button id="infer-run" class="btn">开始生成</button>
      </div>
      <details class="advanced">
        <summary>高级参数</summary>
        <div class="form-grid">
          <label>
            object_id
            <input id="infer-object" type="number" value="0" />
          </label>
          <label>
            image_index
            <input id="infer-index" type="text" value="0, 6, 5" />
          </label>
          <label>
            mask_expand
            <input id="infer-expand" type="number" value="40" />
          </label>
          <label>
            block_size
            <input id="infer-block" type="number" value="16" />
          </label>
          <label>
            seed
            <input id="infer-seed" type="number" value="28588" />
          </label>
        </div>
      </details>
      <div class="status" id="infer-status"></div>
      <div class="media">
        <video id="quick-video-preview" controls></video>
      </div>
      <div class="media" id="infer-media"></div>
      </div>

      <div class="tab-panel" id="tab-details">
        <div class="panel__header">
          <div>
            <h2>素材 / 遮罩</h2>
            <p>查看 15 角度图与 SAM3 可视化结果（用于确认 object_id）。</p>
          </div>
        </div>
        <div class="form-grid">
          <label>
            本地图片上传
            <input id="angle-file" type="file" accept="image/*" />
          </label>
          <label>
            图片 URL
            <input id="angle-url" type="text" placeholder="https://..." />
          </label>
          <label>
            文件夹命名（可选）
            <input id="angle-name" type="text" placeholder="例如：actor_01" />
          </label>
          <button id="angle-generate" class="btn">生成 15 角度图</button>
        </div>
        <div class="status" id="angle-status"></div>
        <details class="advanced">
          <summary>查看已生成文件夹</summary>
          <div class="form-grid">
            <label>
              选择文件夹
              <select id="angle-folder"></select>
            </label>
            <button id="angle-show" class="btn btn-ghost">展示</button>
          </div>
          <div class="gallery" id="angle-gallery"></div>
        </details>

        <div class="divider"></div>

        <div class="form-grid">
          <label>
            使用视频
            <select id="infer-video"></select>
          </label>
          <label>
            传播方式
            <select id="sam3-direction">
              <option value="forward">从第一帧正向传播</option>
              <option value="both">从中间帧双向传播</option>
              <option value="backward">从尾帧反向传播</option>
            </select>
          </label>
          <label>
            文本提示词（默认 person）
            <input id="sam3-prompt" type="text" placeholder="person" />
          </label>
          <button id="sam3-run" class="btn">生成 SAM3 遮罩</button>
        </div>
        <div class="status" id="sam3-status"></div>
        <div class="media" id="sam3-media"></div>

        <details class="advanced">
          <summary>高级参数</summary>
          <div class="form-grid">
            <label>
              image_index
              <input id="infer-index-view" type="text" value="0, 6, 5" />
            </label>
            <label>
              mask_expand
              <input id="infer-expand-view" type="number" value="40" />
            </label>
            <label>
              block_size
              <input id="infer-block-view" type="number" value="16" />
            </label>
            <label>
              seed
              <input id="infer-seed-view" type="number" value="28588" />
            </label>
            <label>
              object_id
              <input id="infer-object-view" type="number" value="0" />
            </label>
          </div>
        </details>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>ComfyUI workflow: 换人_api.json</span>
    <span>前端展示专用 · 可按需扩展</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
