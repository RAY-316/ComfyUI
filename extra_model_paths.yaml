# Rename this to extra_model_paths.yaml and ComfyUI will load it

# config for comfyui (你的当前 ComfyUI 保持默认或小改)
comfyui:
  base_path: /home/ubuntu/sidbao-vfhq-us-east-3/rayy/Comfy_test/ComfyUI
  # 可以保留默认子路径，或注释掉
  # checkpoints: models/checkpoints/
  # vae: models/vae/
  # loras: models/loras/
  # 为 WanVideoModelLoader 添加额外的 diffusion_models 路径（支持多路径）
  diffusion_models: |
    models/diffusion_models
    models/unet
    /home/ubuntu/sidbao-vfhq-us-east-3/rayy/local_test/ComfyUI/models/diffusion_models
    /home/ubuntu/sidbao-vfhq-us-east-3/rayy/local_test/ComfyUI/models/unet
  # 映射整个 local_test 的 models 目录
  checkpoints: |
    models/checkpoints/
    /home/ubuntu/sidbao-vfhq-us-east-3/rayy/local_test/ComfyUI/models/checkpoints/
  vae: |
    models/vae/
    /home/ubuntu/sidbao-vfhq-us-east-3/rayy/local_test/ComfyUI/models/vae/
  loras: |
    models/loras/
    /home/ubuntu/sidbao-vfhq-us-east-3/rayy/local_test/ComfyUI/models/loras/
  clip_vision: |
    models/clip_vision/
    /home/ubuntu/sidbao-vfhq-us-east-3/rayy/local_test/ComfyUI/models/clip_vision/
  text_encoders: |
    models/text_encoders/
    /home/ubuntu/sidbao-vfhq-us-east-3/rayy/local_test/ComfyUI/models/text_encoders/
  detection: /home/ubuntu/sidbao-vfhq-us-east-3/rayy/local_test/ComfyUI/models/detection
  sam3: /home/ubuntu/sidbao-vfhq-us-east-3/rayy/local_test/ComfyUI/models/sam3
  # 其他模型类型也可以按需添加
  # embeddings: |
  #   models/embeddings/
  #   /home/ubuntu/sidbao-vfhq-us-east-3/rayy/local_test/ComfyUI/models/embeddings/
  # controlnet: |
  #   models/controlnet/
  #   /home/ubuntu/sidbao-vfhq-us-east-3/rayy/local_test/ComfyUI/models/controlnet/
  # upscale_models: |
  #   models/upscale_models/
  #   /home/ubuntu/sidbao-vfhq-us-east-3/rayy/local_test/ComfyUI/models/upscale_models/

# 添加你的额外模型文件夹作为一个新 "UI" 配置（最可靠方式）
local_test:
  base_path: /home/ubuntu/sidbao-vfhq-us-east-3/rayy/local_test/ComfyUI
  is_default: false  # 可选，不设为默认优先
  checkpoints: models/checkpoints/     # 假设你的模型在 models/checkpoints/ 下
  vae: models/vae/
  loras: models/loras/
  clip_vision: models/clip_vision/
  text_encoders: models/text_encoders/
  diffusion_models: |
    models/diffusion_models
    models/unet
  # 根据你的实际子文件夹添加更多类型（参考 example）
  # embeddings: models/embeddings/
  # controlnet: models/controlnet/
  # upscale_models: models/upscale_models/
  # 等...

# 如果你想在 comfyui 下直接补充单个额外路径（某些类型支持多路径）
# 示例：只加 diffusion_models 的额外路径
# comfyui:
#   diffusion_models: |
#     models/diffusion_models
#     /home/ubuntu/sidbao-vfhq-us-east-3/rayy/local_test/ComfyUI/models/diffusion_models